name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Spring Boot line the starter supports, and the newest
        include:
          - name: Spring Boot 3.5
            profile: ""
          - name: Spring Boot 4.1
            profile: "-Pboot4"
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: ./mvnw -B verify ${{ matrix.profile }}
